name: Publish to crates.io

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validation.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: wakamex/release-actions/verify-release-tag@stable
        with:
          version-command: cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "w3grs") | .version'
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: publish
    permissions:
      contents: write
    uses: wakamex/release-actions/.github/workflows/github-release.yml@stable
